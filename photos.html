<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A few favorite photos from Your Name.">
  <title>Photos | Jaden Jamieson</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="site">
    <header class="site-header">
      <a class="wordmark" href="index.html">Your Name</a>
      <nav aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="index.html#projects">Projects</a>
        <a aria-current="page" href="photos.html">Photos</a>
        <a href="resume.pdf" target="_blank" rel="noopener noreferrer">Resume ↗</a>
      </nav>
    </header>
    <main>
      <h1>Photos</h1>
      <p>A few snapshots from outside of school. Replace these placeholders with your own images and captions.</p>
      <div class="photo-grid">
        <!-- EXAMPLE: replace each placeholder block with <figure><img src="photo1.jpg" alt="Hiking trip"><figcaption>Weekend hike</figcaption></figure> -->
       
<figure>
  <img src="big-tex.png" alt="Texas football game">
  <figcaption>Big Tex at the Texas State Fair — October 10, 2026</figcaption>
</figure>

        <figure><div class="photo-placeholder">Your photo here</div><figcaption>Photo two</figcaption></figure>
        <figure><div class="photo-placeholder">Your photo here</div><figcaption>Photo three</figcaption></figure>
        <figure><div class="photo-placeholder">Your photo here</div><figcaption>Photo four</figcaption></figure>
      </div>
    </main>
    <footer>© 2026 Your Name</footer>
  </div>
  
<style>
  .photo-grid img {
    cursor: zoom-in;
  }

  #photo-lightbox {
    background: #171717;
    color: white;
    border: none;
    border-radius: 6px;
    padding: 18px;
    max-width: 96vw;
    max-height: 96vh;
  }

  #photo-lightbox::backdrop {
    background: rgba(0, 0, 0, 0.9);
  }

  #photo-lightbox img {
    display: block;
    width: auto;
    height: auto;
    max-width: 90vw;
    max-height: 75vh;
    object-fit: contain;
    margin: auto;
  }

  #lightbox-caption {
    font-size: 22px;
    text-align: center;
    margin-top: 15px;
    color: white;
  }

  #close-lightbox {
    display: block;
    margin: 0 0 12px auto;
    background: none;
    color: white;
    border: none;
    font-size: 17px;
    cursor: pointer;
  }
</style>

<dialog id="photo-lightbox">
  <button id="close-lightbox">✕ Close</button>
  <img id="lightbox-image" alt="">
  <p id="lightbox-caption"></p>
</dialog>

<script>
  const lightbox = document.getElementById("photo-lightbox");

  document.querySelectorAll(".photo-grid figure img").forEach(img => {
    img.tabIndex = 0;
    img.setAttribute("role", "button");

    const openPhoto = () => {
      const figure = img.closest("figure");
      const caption = figure.querySelector("figcaption");

      document.getElementById("lightbox-image").src = img.src;
      document.getElementById("lightbox-image").alt = img.alt;
      document.getElementById("lightbox-caption").textContent =
        caption ? caption.textContent : "";

      lightbox.showModal();
    };

    img.addEventListener("click", openPhoto);
    img.addEventListener("keydown", event => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        openPhoto();
      }
    });
  });

  document.getElementById("close-lightbox").onclick =
    () => lightbox.close();

  lightbox.addEventListener("click", event => {
    if (event.target === lightbox) lightbox.close();
  });
</script>

</body>
</html>
